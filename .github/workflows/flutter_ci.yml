name: Flutter CI

on:
  workflow_dispatch:        # manual run button
  push:
    branches:
      - dev_with_tests
  pull_request:
    branches:
      - dev_with_tests

jobs:
  build-and-test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter (pinned version matching project Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.6'   # <<-- pin an exact release known to include Dart 3.9.x

      - name: Validate flutter
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run unit tests (with coverage)
        run: flutter test --coverage

      - name: Format coverage (optional)
        run: |
          dart pub global activate coverage
          dart run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.packages \
            --report-on=lib
